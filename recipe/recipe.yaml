schema_version: 1

context:
  version: "1.12.1"

package:
  name: parsel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parsel/parsel-${{ version }}.tar.gz
  sha256: f526df846f3a91e13f5499156ea3e755114834cd126b62cd1d784ef558f3a713

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - cssselect >=1.2.0
    - jmespath >=1.0.0
    - lxml >=5.1.0
    - w3lib >=1.19.0
tests:
  - python:
      imports:
        - parsel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Parsel is a library to extract data from HTML and XML using XPath and CSS selectors
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/parsel/
  repository: https://github.com/scrapy/parsel

extra:
  recipe-maintainers:
    - synapticarbors
    - Gallaecio
    - AdrianAtZyte
    - kmike
    - wRAR
    - dangra
    - rmax
